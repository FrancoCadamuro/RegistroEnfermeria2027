<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Acceso denegado
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family:
                Arial,
                sans-serif;

            min-height:
                100vh;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            background:
                linear-gradient(
                    rgba(14,42,71,.92),
                    rgba(14,42,71,.92)
                ),
                url("../assets/img/fondo-mater.png");

            background-size:
                cover;

            background-position:
                center;
        }

        .card {

            width:
                450px;

            background:
                rgba(255,255,255,.96);

            border-radius:
                28px;

            padding:
                45px;

            text-align:
                center;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.25);
        }

        .logo {

            width:
                100px;

            margin-bottom:
                20px;
        }

        .icono {

            font-size:
                60px;

            margin-bottom:
                15px;
        }

        h1 {

            color:
                #991b1b;

            margin-bottom:
                15px;
        }

        p {

            color:
                #475569;

            line-height:
                1.6;

            margin-bottom:
                30px;
        }

        .btn {

            border:
                none;

            background:
                linear-gradient(
                    135deg,
                    #0c5ea8,
                    #154c8d
                );

            color:
                white;

            padding:
                16px 24px;

            border-radius:
                16px;

            cursor:
                pointer;

            font-size:
                15px;

            font-weight:
                bold;

            transition:
                .2s;
        }

        .btn:hover {

            transform:
                translateY(-2px);
        }

    </style>

</head>

<body>

<div class="card">

    <img
        src="../assets/img/logo-mater.png"
        class="logo"
        alt="Mater Purissima"
    >

    <div class="icono">
        🚫
    </div>

    <h1>
        Acceso no autorizado
    </h1>

    <p>
        Tu cuenta institucional no tiene permisos
        para acceder al Sistema de Registro
        del Colegio Mater Purissima.
        <br><br>
        Contactá con administración si creés
        que esto es un error.
    </p>

    <button
        class="btn"
        onclick="volver()"
    >
        Volver al inicio
    </button>

</div>

<script>

function volver() {

    location.href =
        "login.html";
}

</script>

</body>
</html>
